<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ficha de requerimientos del Equipo UX: de las respuestas del stakeholder a historias de usuario, requerimientos no funcionales y pendientes.">
<title>Ficha de requerimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Tokens: SISOC DS (Figma "Nuevo DS SISOC"), mismos que el cuestionario previo. */
:root{
  --primary:#04756f; --primary-dark:#045f5b; --primary-light:#379f9b; --on-primary:#ffffff;
  --primary-text:#045f5b; --primary-soft:rgba(4,117,111,.10);
  --secondary:#ffc000; --secondary-text:#7a5c00;
  --bg:#f5f5f4; --paper:#ffffff; --text:#1c1917; --text2:#57534e; --disabled:#a8a29e;
  --divider:#e7e5e4; --outline:rgba(0,0,0,.23); --hover:rgba(0,0,0,.04); --selected:rgba(0,0,0,.08);
  --nav:#045f5b; --nav-text:#fafaf9; --nav-muted:#d6d3d1;
  --error:#c62828; --success:#1b5e20; --info:#01579b; --warning:#8a3a00;
  --info-bg:rgba(1,105,159,.08); --warning-bg:rgba(237,108,2,.08); --success-bg:rgba(46,125,50,.08);
  --shadow1:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);
  --shadow4:0 2px 4px -1px rgba(0,0,0,.2),0 4px 5px 0 rgba(0,0,0,.14),0 1px 10px 0 rgba(0,0,0,.12);
  --font:'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r:4px; --r-md:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --primary:#379f9b; --primary-dark:#04756f; --primary-light:#54c4c0; --on-primary:#1c1917;
  --primary-text:#54c4c0; --primary-soft:rgba(55,159,155,.18);
  --secondary:#ffcd33; --secondary-text:#ffcd33;
  --bg:#1c1917; --paper:#292524; --text:#fafaf9; --text2:#a8a29e; --disabled:#78716c;
  --divider:#44403c; --outline:rgba(255,255,255,.23); --hover:rgba(255,255,255,.08); --selected:rgba(255,255,255,.16);
  --nav:#073b38; --nav-text:#fafaf9; --nav-muted:#d6d3d1;
  --error:#ef5350; --success:#79c57c; --info:#3dc1fd; --warning:#ffb74d;
  --info-bg:rgba(3,169,244,.12); --warning-bg:rgba(255,152,0,.12); --success-bg:rgba(76,175,80,.12);
  --shadow1:0 2px 1px -1px rgba(0,0,0,.5),0 1px 1px 0 rgba(0,0,0,.4),0 1px 3px 0 rgba(0,0,0,.36);
  --shadow4:0 2px 4px -1px rgba(0,0,0,.5),0 4px 5px 0 rgba(0,0,0,.4),0 1px 10px 0 rgba(0,0,0,.36);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --primary:#379f9b; --primary-dark:#04756f; --primary-light:#54c4c0; --on-primary:#1c1917;
  --primary-text:#54c4c0; --primary-soft:rgba(55,159,155,.18);
  --secondary:#ffcd33; --secondary-text:#ffcd33;
  --bg:#1c1917; --paper:#292524; --text:#fafaf9; --text2:#a8a29e; --disabled:#78716c;
  --divider:#44403c; --outline:rgba(255,255,255,.23); --hover:rgba(255,255,255,.08); --selected:rgba(255,255,255,.16);
  --nav:#073b38; --nav-text:#fafaf9; --nav-muted:#d6d3d1;
  --error:#ef5350; --success:#79c57c; --info:#3dc1fd; --warning:#ffb74d;
  --info-bg:rgba(3,169,244,.12); --warning-bg:rgba(255,152,0,.12); --success-bg:rgba(76,175,80,.12);
  --shadow1:0 2px 1px -1px rgba(0,0,0,.5),0 1px 1px 0 rgba(0,0,0,.4),0 1px 3px 0 rgba(0,0,0,.36);
  --shadow4:0 2px 4px -1px rgba(0,0,0,.5),0 4px 5px 0 rgba(0,0,0,.4),0 1px 10px 0 rgba(0,0,0,.36);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;letter-spacing:.009em}
.appbar{background:var(--nav);color:var(--nav-text);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;box-shadow:var(--shadow4)}
.appbar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.appbar .mark{width:32px;height:32px;border-radius:var(--r);background:var(--secondary);color:#1c1917;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.appbar h1{font-size:20px;font-weight:500;margin:0;letter-spacing:.0075em}
.appbar .sub{color:var(--nav-muted);font-size:14px;margin-left:auto}
main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:16px}
.paper{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow1)}
.intro{padding:20px 24px;display:flex;flex-direction:column;gap:8px}
.intro h2{margin:0;font-size:24px;font-weight:400;text-wrap:balance}
.intro p{margin:0;color:var(--text2);max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill{font-size:13px;letter-spacing:.016em;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-text)}
/* stepper */
.stepper-wrap{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.progress{height:4px;border-radius:2px;background:var(--divider);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);transition:width .25s}
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.step{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--text2);font:inherit;font-size:14px;padding:6px 10px 6px 6px;border-radius:999px;cursor:pointer}
.step:hover{background:var(--hover)}
.step:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;background:var(--disabled);color:#fff}
.step.done .n{background:var(--primary)}
.step.cur{color:var(--text);font-weight:500;background:var(--primary-soft)}
.step.cur .n{background:var(--primary);color:var(--on-primary)}
.step.skip{opacity:.5}
.step .lbl{white-space:nowrap}
/* section card */
.card{padding:24px;display:flex;flex-direction:column;gap:20px}
.card-head{display:flex;flex-direction:column;gap:4px}
.overline{font-size:12px;letter-spacing:.083em;text-transform:uppercase;color:var(--primary-text);font-weight:500}
.card h3{margin:0;font-size:20px;font-weight:500;letter-spacing:.0075em;text-wrap:balance}
.card .lead{margin:0;color:var(--text2);font-size:14px;max-width:68ch}
.hu-tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--secondary);color:#1c1917;vertical-align:2px;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.card{padding:20px 16px}.appbar .sub{margin-left:0;width:100%}}
/* text field (MUI outlined) */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:14px;font-weight:500;color:var(--text);letter-spacing:.007em}
.req{color:var(--error);margin-left:2px}
.field input,.field textarea,.field select{font:inherit;font-size:16px;color:var(--text);background:transparent;border:1px solid var(--outline);border-radius:var(--r);padding:12px 14px;width:100%;min-width:0}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.field input:hover,.field textarea:hover,.field select:hover{border-color:var(--text)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.field ::placeholder{color:var(--disabled)}
.help{font-size:12px;color:var(--text2);letter-spacing:.033em;line-height:1.6}
/* chips / radios */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;letter-spacing:.012em;border:1px solid var(--outline);background:transparent;color:var(--text);padding:6px 14px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--hover)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text);font-weight:500}
.chip[aria-pressed="true"]::before,.chip[aria-checked="true"]::before{content:"";width:14px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-2px)}
/* repeatable items */
.items{display:flex;flex-direction:column;gap:16px}
.item{border:1px solid var(--divider);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:16px;border-left:4px solid var(--primary)}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-head strong{font-size:16px;font-weight:500}
.hu-sentence{font-size:14px;color:var(--text2);background:var(--bg);border-radius:var(--r);padding:10px 12px;line-height:1.6}
.hu-sentence b{color:var(--primary-text);font-weight:500}
/* buttons */
.btn{font:inherit;font-size:14px;font-weight:500;letter-spacing:.029em;text-transform:uppercase;border-radius:var(--r);padding:8px 22px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-c{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow1)}
.btn-c:hover{background:var(--primary-dark);color:#fff}
.btn-o{background:transparent;color:var(--primary-text);border:1px solid var(--primary)}
.btn-o:hover{background:var(--primary-soft)}
.btn-t{background:transparent;color:var(--primary-text);padding:8px 12px}
.btn-t:hover{background:var(--primary-soft)}
.btn-t.danger{color:var(--error)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--divider)}
.nav .saved{font-size:12px;color:var(--text2);letter-spacing:.033em}
/* alerts */
.alert{border-radius:var(--r);padding:12px 16px;font-size:14px;display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.alert .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.alert.info{background:var(--info-bg);color:var(--text)} .alert.info .ic{background:var(--info)}
.alert.warn{background:var(--warning-bg);color:var(--text)} .alert.warn .ic{background:var(--warning)}
.alert.ok{background:var(--success-bg);color:var(--text)} .alert.ok .ic{background:var(--success)}
.alert ul{margin:4px 0 0;padding-left:18px}
.preview{font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--bg);border:1px solid var(--divider);border-radius:var(--r);padding:16px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:12px 18px;border-radius:var(--r);font-size:14px;box-shadow:var(--shadow4);max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Ficha de requerimientos: lista de fichas → editor por secciones → exportaciones */
.appbar-in,main{max-width:1040px}
.appbar .mark{font-size:12px}
.save-state{font-size:12px;letter-spacing:.033em;color:var(--nav-muted);margin-left:auto}
.appbar .sub{margin-left:0}
main{padding-block:20px 56px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spacer{flex:1}
.muted{color:var(--text2)}
.small{font-size:13px}
h2.h{margin:0;font-size:22px;font-weight:400;text-wrap:balance}
/* home */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.flow div{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text2);min-width:0}
.flow b{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:500}
.flow strong{display:block;color:var(--text);font-weight:500}
@media (max-width:720px){.flow{grid-template-columns:1fr}}
.import{padding:20px 24px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--divider)}
.drop{border:1px dashed var(--outline);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--text2)}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.list-head{padding:16px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--divider)}
.list-head .field{flex:1;min-width:200px}
.list-head .field input{padding:9px 12px}
.fichas{display:flex;flex-direction:column}
.ficha{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 16px;align-items:center;padding:14px 24px;border:0;border-bottom:1px solid var(--divider);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.ficha:last-child{border-bottom:0}
.ficha:hover{background:var(--hover)}
.ficha:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.ficha .code{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--primary-text);background:var(--primary-soft);padding:2px 8px;border-radius:var(--r)}
.ficha .nm{min-width:0}
.ficha .nm strong{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha .nm span{font-size:13px;color:var(--text2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha .cnt{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:640px){.ficha{grid-template-columns:auto 1fr;padding:14px 16px}.ficha .cnt{grid-column:2}.list-head,.import{padding-inline:16px}}
.empty{padding:32px 24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--text2);max-width:60ch}
/* status pills */
.st{font-size:12px;font-weight:500;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.st-borrador{background:var(--bg);color:var(--text2);border-color:var(--divider)}
.st-revision{background:var(--warning-bg);color:var(--warning)}
.st-validada{background:var(--success-bg);color:var(--success)}
/* editor header */
.ed-head{padding:16px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ed-head .ttl{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.ed-head .ttl strong{font-size:20px;font-weight:500;overflow-wrap:anywhere}
.ed-head .ttl span{font-size:13px;color:var(--text2)}
.banner{margin:0 24px 16px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 16px;border-top:1px solid var(--divider);scrollbar-width:thin}
.tab{flex:none;border:0;background:none;font:inherit;font-size:14px;font-weight:500;letter-spacing:.029em;color:var(--text2);padding:12px 14px;border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--hover)}
.tab:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.tab[aria-selected="true"]{color:var(--primary-text);border-bottom-color:var(--primary)}
.tab .b{font-size:11px;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--selected);color:var(--text);font-variant-numeric:tabular-nums}
.tab .b.warn{background:var(--warning-bg);color:var(--warning)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid3{grid-template-columns:1fr}.ed-head{padding:12px 16px}.ed-head .ttl{order:-1;flex-basis:100%}.banner{margin-inline:16px}}
.field select{appearance:auto}
.sec{display:flex;flex-direction:column;gap:16px}
.sec+.sec{border-top:1px solid var(--divider);padding-top:20px}
.sec h4{margin:0;font-size:16px;font-weight:500}
/* HU cards */
.hu{border:1px solid var(--divider);border-radius:var(--r-md);overflow:hidden}
.hu.open{border-color:var(--primary);box-shadow:var(--shadow1)}
.hu-head{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;width:100%;border:0;background:var(--paper);font:inherit;color:inherit;text-align:left;padding:12px 16px;cursor:pointer}
.hu-head:hover{background:var(--hover)}
.hu-head:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.hu-head .code,.code-sm{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--primary-text);white-space:nowrap}
.hu-head .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.hu-head .pr{justify-self:start}
.hu-head .m{font-size:12px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.hu-head .m.warn{color:var(--warning)}
@media (max-width:640px){.hu-head{grid-template-columns:auto 1fr}.hu-head .m{grid-column:2}}
.hu-body{padding:16px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--divider)}
.pr{font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--text2);border:1px solid var(--divider)}
.pr-debe{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pr-deberia{background:var(--primary-soft);color:var(--primary-text);border-color:transparent}
.pr-podria{background:transparent;color:var(--text2);border-color:var(--outline)}
.pr-no{background:transparent;color:var(--disabled);border-color:var(--divider);text-decoration:line-through}
.sub-list{display:flex;flex-direction:column;gap:8px}
.sub-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.sub-row .lbl{font-family:var(--mono);font-size:12.5px;color:var(--primary-text);padding-top:12px;min-width:34px}
.sub-row textarea,.sub-row input{font:inherit;font-size:15px;color:var(--text);background:transparent;border:1px solid var(--outline);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0;resize:vertical}
.sub-row textarea{min-height:46px;line-height:1.45}
.sub-row textarea:focus,.sub-row input:focus{outline:none;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.x{border:0;background:none;color:var(--text2);font:inherit;font-size:20px;line-height:1;width:36px;height:40px;border-radius:var(--r);cursor:pointer}
.x:hover{background:var(--hover);color:var(--error)}
.x:focus-visible{outline:2px solid var(--primary)}
.tc{font-size:13px;color:var(--text2);background:var(--bg);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;line-height:1.5}
.tc b{font-weight:500;color:var(--text)}
.tc code{font-family:var(--mono);font-size:12px;color:var(--primary-text)}
/* tabular rows (RNF, riesgos) */
.rows{display:flex;flex-direction:column;gap:12px}
.rowcard{border:1px solid var(--divider);border-radius:var(--r-md);padding:14px 16px;display:grid;grid-template-columns:auto 200px 1fr auto;gap:12px;align-items:start}
.rowcard .code-sm{padding-top:12px}
.rowcard .field label{font-size:12px;font-weight:400;color:var(--text2)}
.rowcard .field input,.rowcard .field textarea,.rowcard .field select{padding:9px 11px;font-size:15px}
.rowcard .field textarea{min-height:44px}
.rowcard .x{margin-top:18px}
@media (max-width:760px){.rowcard{grid-template-columns:1fr auto}.rowcard .code-sm{padding-top:0}.rowcard>.field{grid-column:1/-1}.rowcard .x{grid-row:1;grid-column:2;margin-top:0}}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
/* export */
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--warning)}
.checks .dot.info{background:var(--info)}
.linkish{border:0;background:none;font:inherit;color:var(--primary-text);text-decoration:underline;cursor:pointer;padding:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--divider);border-radius:var(--r-md);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--text2);letter-spacing:.033em}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
.exp{border:1px solid var(--divider);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px}
.exp h4{margin:0;font-size:16px;font-weight:500}
.exp p{margin:0;font-size:14px;color:var(--text2)}
.seg{display:inline-flex;border:1px solid var(--primary);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:none;font:inherit;font-size:13px;font-weight:500;letter-spacing:.029em;text-transform:uppercase;color:var(--primary-text);padding:8px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--primary)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:-3px}
.nrp{border:1px solid var(--divider);border-radius:var(--r-md);overflow:hidden}
.nrp-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--divider)}
.nrp-h strong{font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.nrp .preview{border:0;border-radius:0;max-height:260px}
.btn-s{min-height:32px;padding:4px 12px;font-size:12.5px}
.import a,.alert a{color:var(--primary-text)}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="mark" aria-hidden="true">UX</div>
    <h1>Ficha de requerimientos</h1>
    <span class="sub">Equipo UX · Análisis funcional y arquitectura de la información</span>
    <span class="save-state" id="saveState" role="status"></span>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=(n,w)=>String(n).padStart(w,'0');
const trim=v=>String(v??'').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const SESSION=uid();
const hoy=()=>new Date().toLocaleDateString('es-AR');
const fmtDate=iso=>{if(!iso)return '';const d=new Date(iso.length===10?iso+'T12:00':iso);return isNaN(d)?iso:d.toLocaleDateString('es-AR');};
const ago=ts=>{if(!ts)return '';const m=Math.round((Date.now()-ts)/60000);if(m<1)return 'recién';if(m<60)return `hace ${m} min`;const h=Math.round(m/60);if(h<24)return `hace ${h} h`;return new Date(ts).toLocaleDateString('es-AR');};
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200);}
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setP(o,p,v){const k=p.split('.');let a=o;for(let i=0;i<k.length-1;i++)a=a[k[i]];a[k[k.length-1]]=v;}
const slug=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ---------- catálogos ---------- */
const SISTEMAS=['FCH · Formando Capital Humano (cursos y formación)','SIIS · Sistema Integrado de Información Social','SISOC · Gestión de programas sociales','Portal Empleo · Búsqueda de empleo y carga de CV','Otro sistema','Ninguno','No sé'];
const SENALES=['Menos consultas','Más inscripciones completas','Menos tiempo de carga','Datos más confiables','Menos errores','Mejor seguimiento','Otro'];
const SENSIBLES=['Datos personales','Salud','Situación social','Personas menores de edad','Ninguno','No sé'];
const PRIOS=['Debe','Debería','Podría','No por ahora'];
const PRIO_CLS={'Debe':'debe','Debería':'deberia','Podría':'podria','No por ahora':'no'};
const EST_HU=['Propuesta','Validada','En diseño','En desarrollo','En prueba','Hecha','Descartada'];
const ORIGENES=['Cuestionario','Documento','Reunión','Análisis UX'];
const CAT_RNF=['Accesibilidad','Usabilidad','Conectividad y rendimiento','Dispositivos','Seguridad y privacidad','Normativa','Diseño visual','Disponibilidad','Otro'];
const TIPO_R=['Pregunta abierta','Pendiente','Riesgo','Supuesto','Restricción','Dependencia'];
const EST_FICHA=[['borrador','Borrador'],['revision','En revisión'],['validada','Validada con stakeholder']];
const LBL_EST=Object.fromEntries(EST_FICHA);
const SN=[['si','Sí'],['no','No'],['nose','No sé']];
const LBL={nueva:'Plataforma nueva',mejora:'Mejora de una existente',nose:'No sé',si:'Sí',no:'No',pedir:'Hay que pedirlo'};

/* ---------- modelo ---------- */
const nuevoPerfil=()=>({uid:uid(),nombre:'',cantidad:'',dispositivo:'',conexion:'',manejo:'',notas:''});
function blank(){return{
  v:1,
  meta:{codigo:'',nombre:'',organismo:'',area:'',referente:'',contacto:'',tipo:'',plataforma:'',sistemas:[],fecha:'',fechaMotivo:'',
        responsable:'',reunion:'',neurappi:'',carpeta:'',links:'',material:'',estado:'borrador',version:'0.1',origen:''},
  ctx:{problema:'',hoy:'',siNo:'',objetivo:'',senales:[],senalOtra:'',alcance:'',fuera:'',bien:'',quejas:'',uso:'',accesoActual:''},
  perfiles:[nuevoPerfil()],
  hus:[], nHU:0,
  rnf:[], nRNF:0,
  datos:{entidades:'',base:'',baseCual:'',acceso:'',sensibles:[],legal:'',legalDetalle:'',responsable:'',notas:''},
  riesgos:[], nR:0
};}
function nuevaHU(f,o={}){f.nHU++;return Object.assign({uid:uid(),n:f.nHU,titulo:'',como:'',quiero:'',para:'',prioridad:'',estado:'Propuesta',origen:'Reunión',cas:[''],datos:'',deps:'',figma:'',neurappi:'',notas:''},o);}
function nuevoRNF(f,o={}){f.nRNF++;return Object.assign({uid:uid(),n:f.nRNF,cat:'',desc:'',verif:''},o);}
function nuevoR(f,o={}){f.nR++;return Object.assign({uid:uid(),n:f.nR,tipo:'Pendiente',texto:'',resp:'',estado:'Abierto'},o);}
function normalize(f){const b=blank();const out=Object.assign(b,f||{});
  out.meta=Object.assign(blank().meta,f&&f.meta);out.ctx=Object.assign(blank().ctx,f&&f.ctx);out.datos=Object.assign(blank().datos,f&&f.datos);
  ['perfiles','hus','rnf','riesgos'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});
  out.hus.forEach(h=>{if(!Array.isArray(h.cas))h.cas=[''];});
  out.nHU=Math.max(out.nHU||0,...out.hus.map(h=>h.n||0),0);out.nRNF=Math.max(out.nRNF||0,...out.rnf.map(h=>h.n||0),0);out.nR=Math.max(out.nR||0,...out.riesgos.map(h=>h.n||0),0);
  return out;}
const COD=f=>(trim(f.meta.codigo)||'PRY').toUpperCase();
const huCode=(f,h)=>`${COD(f)}-HU-${pad(h.n,3)}`;
const rnfCode=(f,r)=>`${COD(f)}-RNF-${pad(r.n,2)}`;
const rCode=(f,r)=>`${COD(f)}-R-${pad(r.n,2)}`;
const huTitle=h=>trim(h.titulo)||(trim(h.quiero)?cap(trim(h.quiero)).slice(0,80):'Historia sin título');
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const lc=s=>s?s[0].toLowerCase()+s.slice(1):s;
const cas=h=>h.cas.map(trim).filter(Boolean);
function tcOf(ca){const t=ca.replace(/\.$/,'');return /^dado\b/i.test(t)?`Escenario: ${t}.`:/^verificar\b/i.test(t)?`${cap(t)}.`:`Verificar que ${lc(t)}.`;}
function sugerirCodigo(org){const stop=new Set(['de','del','la','las','el','los','y','e','para','en','a','por']);
  const w=String(org||'').normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^A-Za-z]+/).filter(x=>x&&!stop.has(x.toLowerCase()));
  return w.map(x=>x[0].toUpperCase()).join('').slice(0,5);}

/* ---------- sugerencias (RNF y pendientes) ---------- */
function sugerenciasRNF(f){
  const S=[],P=f.perfiles.filter(p=>trim(p.nombre));
  const quienes=fn=>P.filter(fn).map(p=>trim(p.nombre)).join(', ');
  const cel=quienes(p=>p.dispositivo==='Celular'||p.dispositivo==='Las dos');
  if(cel)S.push({cat:'Dispositivos',desc:`Diseño pensado primero para celular (mobile first), usable en equipos de gama media. Perfiles: ${cel}.`,verif:'Las tareas principales se completan en un celular de 360 px de ancho sin desplazamiento horizontal.'});
  const con=quienes(p=>p.conexion==='Mala o sin conexión'||p.conexion==='Regular');
  if(con)S.push({cat:'Conectividad y rendimiento',desc:`Tolerar conexión inestable: guardar avances y reintentar el envío sin perder datos. Perfiles: ${con}.`,verif:'Si se corta la conexión durante una carga, los datos se conservan y se envían al reconectar.'});
  const man=quienes(p=>p.manejo==='Poco'||p.manejo==='Más o menos');
  if(man)S.push({cat:'Usabilidad',desc:`Lenguaje simple, pasos cortos y ayuda en cada campo. Perfiles: ${man}.`,verif:'Una persona del perfil completa la tarea principal sin asistencia en una prueba con usuarios.'});
  S.push({cat:'Accesibilidad',desc:'Cumplir la Ley 26.653 de accesibilidad web y las pautas WCAG 2.1 nivel AA.',verif:'Revisión automática y manual sin errores de nivel A ni AA; navegación completa con teclado.'});
  const sens=f.datos.sensibles.filter(x=>x!=='Ninguno'&&x!=='No sé');
  if(sens.length)S.push({cat:'Seguridad y privacidad',desc:`Acceso por rol, registro de auditoría de consultas y cambios, y resguardo según la Ley 25.326 de Protección de Datos Personales. Incluye: ${sens.join(', ').toLowerCase()}.`,verif:'Cada perfil ve solo los datos que le corresponden; queda registro de quién consultó o modificó cada dato.'});
  if(f.meta.sistemas.some(x=>/^SISOC/.test(x)))S.push({cat:'Diseño visual',desc:'Usar el design system de SISOC (Nuevo DS SISOC, MUI 5).',verif:'Las pantallas usan componentes y tokens del DS sin estilos sueltos.'});
  if(f.meta.sistemas.some(x=>/^(FCH|Portal Empleo)/.test(x)))S.push({cat:'Diseño visual',desc:'Usar el design system de PE + FCH (Versión Tecnológica, basado en ar-poncho).',verif:'Las pantallas usan componentes y tokens del DS sin estilos sueltos.'});
  return S;}
function sugerenciasR(f){
  const S=[],m=f.meta,d=f.datos;
  if(m.fecha)S.push({tipo:'Restricción',texto:`Fecha que no se puede mover: ${fmtDate(m.fecha)}${trim(m.fechaMotivo)?` (${trim(m.fechaMotivo)})`:''}.`});
  if(d.acceso==='pedir')S.push({tipo:'Pendiente',texto:'Pedir acceso a los datos necesarios y definir quién lo autoriza.'});
  if(d.acceso==='nose'||!d.acceso)S.push({tipo:'Pregunta abierta',texto:'¿Tenemos acceso a los datos que usa la plataforma? ¿Quién lo autoriza?'});
  if(d.base==='nose')S.push({tipo:'Pregunta abierta',texto:'¿Los datos ya existen en alguna base? ¿Quién la administra?'});
  if(d.legal==='si')S.push({tipo:'Pendiente',texto:`Gestionar convenio, autorización o auditoría legal${trim(d.legalDetalle)?`: ${trim(d.legalDetalle)}`:''}.`});
  if(d.legal==='nose')S.push({tipo:'Pregunta abierta',texto:'¿Hace falta convenio, autorización o auditoría legal? Consultar con Legales.'});
  if(d.sensibles.includes('Personas menores de edad'))S.push({tipo:'Riesgo',texto:'Se tratan datos de personas menores de edad: requiere revisión de Legales antes de diseñar el modelo de datos.'});
  if(m.tipo==='nose')S.push({tipo:'Pregunta abierta',texto:'Definir si es una plataforma nueva o una mejora de una existente.'});
  if(m.tipo==='mejora'&&!trim(f.ctx.accesoActual))S.push({tipo:'Pendiente',texto:'Conseguir acceso (y usuario de prueba) a la plataforma actual.'});
  if(m.sistemas.includes('No sé'))S.push({tipo:'Pregunta abierta',texto:'¿Con qué sistemas se relaciona? Confirmar con Sistemas.'});
  return S;}
function aplicarSugerencias(f){
  let a=0;
  const UNICAS=['Accesibilidad','Seguridad y privacidad','Dispositivos','Conectividad y rendimiento','Usabilidad'];
  sugerenciasRNF(f).forEach(s=>{if(!f.rnf.some(r=>trim(r.desc)===s.desc||(UNICAS.includes(s.cat)&&r.cat===s.cat))){f.rnf.push(nuevoRNF(f,s));a++;}});
  sugerenciasR(f).forEach(s=>{if(!f.riesgos.some(r=>trim(r.texto)===s.texto)){f.riesgos.push(nuevoR(f,s));a++;}});
  return a;}

/* ---------- importar cuestionario (.md) ---------- */
function parseCuestionario(md){
  const txt=String(md||'').replace(/\r/g,'');
  if(!/^#\s*Cuestionario previo/m.test(txt))throw new Error('formato');
  const f=blank();const N=v=>{v=trim(v);return v==='—'?'':v;};
  const secs={};txt.split(/\n(?=## )/).forEach(b=>{const m=b.match(/^## (.+)/);if(m)secs[m[1].trim()]=b;});
  const li=(b,l)=>{if(!b)return '';const m=b.match(new RegExp('^- '+l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+': ?(.*)$','m'));return m?N(m[1]):'';};
  const bold=(b,l)=>{if(!b)return '';const m=b.match(new RegExp('\\*\\*'+l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+':\\*\\* ([\\s\\S]*?)(?=\\n\\n\\*\\*|\\n*$)'));return m?N(m[1]):'';};
  const p=secs['Proyecto'];const m=f.meta;
  m.organismo=li(p,'Organismo');m.area=li(p,'Área');m.referente=li(p,'Referente');m.contacto=li(p,'Contacto');
  const tipo=li(p,'Tipo');if(/^Plataforma nueva/.test(tipo))m.tipo='nueva';else if(/^Mejora/.test(tipo)){m.tipo='mejora';const x=tipo.match(/\((.*)\)\s*$/);if(x)m.plataforma=x[1];}else if(/^No sé/.test(tipo))m.tipo='nose';
  const sis=li(p,'Sistemas relacionados');m.sistemas=sis?sis.split(/,\s*/).filter(x=>SISTEMAS.includes(x)):[];
  const fe=li(p,'Fecha que no se puede mover');if(fe){const x=fe.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s*·\s*(.*))?/);if(x){m.fecha=`${x[3]}-${pad(x[2],2)}-${pad(x[1],2)}`;m.fechaMotivo=N(x[4]||'');}}
  m.codigo=sugerirCodigo(m.organismo);m.nombre='';m.origen=`Cuestionario previo${(txt.match(/Respondido el (\S+)/)||[])[1]?` respondido el ${(txt.match(/Respondido el (\S+)/))[1]}`:''}`;
  const pr=secs['Problema'];const c=f.ctx;
  c.problema=bold(pr,'Qué quieren resolver');c.hoy=bold(pr,'Cómo se resuelve hoy');c.siNo=bold(pr,'Qué pasa si no se resuelve');
  const pe=secs['Perfiles de usuario'];
  if(pe){const rows=pe.split('\n').filter(l=>/^\|/.test(l)).slice(2);
    const ps=rows.map(r=>r.split('|').slice(1,-1).map(N)).filter(r=>r.some(Boolean)).map(r=>Object.assign(nuevoPerfil(),{nombre:r[0]||'',cantidad:r[1]||'',dispositivo:r[2]||'',conexion:r[3]||'',manejo:r[4]||'',notas:r[5]||''}));
    if(ps.length)f.perfiles=ps;}
  const hu=secs['Historias de usuario (borrador)'];
  if(hu){hu.split(/\n(?=### )/).slice(1).forEach(b=>{
    const imp=li(b,'Importancia');const crit=li(b,'Criterio de aceptación');
    const h=nuevaHU(f,{como:li(b,'Como'),quiero:li(b,'Quiero'),para:li(b,'Para'),origen:'Cuestionario',
      prioridad:{Imprescindible:'Debe',Importante:'Debería',Deseable:'Podría'}[imp]||'',
      cas:crit?crit.split(/\s*;\s*|\s+·\s+/).map(trim).filter(Boolean):['']});
    if(!h.cas.length)h.cas=[''];
    if(trim(h.quiero)||trim(h.como))f.hus.push(h);});}
  const qc=secs['Qué cambia si funciona'];
  if(qc){c.objetivo=N(qc.replace(/^## .*\n/,'').split(/\n\*\*Cómo lo notarían/)[0].trim());
    const sen=bold(qc,'Cómo lo notarían');if(sen){sen.split(/,\s*/).forEach(x=>{if(/^Otro: /.test(x)){c.senales.push('Otro');c.senalOtra=x.slice(6);}else if(SENALES.includes(x))c.senales.push(x);});}}
  const da=secs['Datos y permisos'];const d=f.datos;
  if(da){d.entidades=li(da,'Datos que se cargan o consultan');
    const yn=v=>/^Sí/.test(v)?'si':/^No sé/.test(v)?'nose':/^No/.test(v)?'no':/^Hay que pedirlo/.test(v)?'pedir':'';
    const base=li(da,'¿Existen en una base?');d.base=yn(base);if(d.base==='si'){const x=base.split(' · ');d.baseCual=N(x.slice(1).join(' · '));}
    d.acceso=yn(li(da,'¿Tenemos acceso?'));
    const se=li(da,'Datos sensibles');d.sensibles=se?se.split(/,\s*/).filter(x=>SENSIBLES.includes(x)):[];
    const lg=li(da,'¿Convenio, autorización o auditoría legal?');d.legal=yn(lg);if(d.legal==='si'){d.legalDetalle=N(lg.split(' · ').slice(1).join(' · '));}}
  const pa=secs['Plataforma actual'];
  if(pa){c.bien=li(pa,'Qué funciona bien');c.quejas=li(pa,'Qué genera quejas');c.uso=li(pa,'Datos de uso o reclamos');c.accesoActual=li(pa,'Acceso a la plataforma');}
  const ma=secs['Material'];
  if(ma){m.material=li(ma,'Qué material tienen');m.carpeta=li(ma,'Carpeta compartida');
    m.links=ma.split('\n').filter(l=>/^ {2}- /.test(l)).map(l=>l.replace(/^ {2}- /,'').trim()).join('\n');}
  if(!f.hus.length)f.hus.push(nuevaHU(f));
  aplicarSugerencias(f);
  return f;}

/* ---------- almacenamiento: db compartida, o este navegador ---------- */
const LKEY='ficha-requerimientos-v1';
const Store={mode:'cargando',db:null,unsub:null,docs:new Map(),
  async init(){
    let db=null;
    try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}
    if(db){this.db=db;this.mode='db';}else{this.mode='local';}
  },
  local(){try{return JSON.parse(localStorage.getItem(LKEY)||'{}')||{};}catch(e){return {};}},
  localPut(all){try{localStorage.setItem(LKEY,JSON.stringify(all));return true;}catch(e){return false;}},
  watch(cb){
    if(this.mode==='db'){
      this.unsub=this.db.collection('fichas').onSnapshot(s=>{this.docs=new Map(s.docs.map(d=>[d.id,d.data()]));cb();},e=>{toast('Se cortó la conexión con las fichas compartidas. Recargá la página.');});
    }else{const all=this.local();this.docs=new Map(Object.entries(all));cb();}
  },
  async save(id,body){
    if(this.mode==='db'){await this.db.doc('fichas/'+id).set(body);}
    else{const all=this.local();all[id]=body;if(!this.localPut(all))throw new Error('local');this.docs.set(id,body);}
  },
  async remove(id){
    if(this.mode==='db'){await this.db.doc('fichas/'+id).delete();}
    else{const all=this.local();delete all[id];this.localPut(all);this.docs.delete(id);}
  }
};

/* ---------- estado de la vista ---------- */
let view='home', curId=null, F=null, tab=0, q='', importOpen=false, importText='', importErr='';
let viaClaude=false, claudeResp='', docReading='', sampleNS=null, docOpen=false, docText='', docName='', docErr='', docBusy=false, docCtl=null;
let lastSaved=0, dirty=false, saving=false, saveTimer=null, remoteNewer=false, armedDelete=false;
const openHU=new Set();
let expMode='md';
try{const t=sessionStorage.getItem('fr-tab');if(t)tab=+t||0;}catch(e){}

function bodyOf(f){const now=Date.now();return{
  codigo:COD(f),nombre:trim(f.meta.nombre),organismo:trim(f.meta.organismo),estado:f.meta.estado,
  nHU:f.hus.length,nRNF:f.rnf.length,nPend:f.riesgos.filter(r=>r.estado!=='Resuelto').length,
  updatedAt:now,por:SESSION,ficha:f};}
function setSaveState(t){$('#saveState').textContent=t;}
function scheduleSave(){dirty=true;setSaveState('Cambios sin guardar…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,900);}
async function flush(){
  if(!F||!curId||!dirty)return;
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);return;}
  saving=true;dirty=false;const b=bodyOf(F);
  try{await Store.save(curId,b);lastSaved=b.updatedAt;setSaveState(Store.mode==='db'?'Guardado · compartido con el equipo':'Guardado en este navegador');}
  catch(e){dirty=true;setSaveState('No se pudo guardar');
    if(e&&e.code==='quota_exceeded')toast('No hay más espacio para fichas. Eliminá alguna que ya no uses.');
    else if(e&&e.code==='invalid_argument')toast('No tenés permiso para editar estas fichas. Pedile acceso de colaborador a quien las comparte.');
    else{toast('No se pudo guardar. Reintentamos en unos segundos.');clearTimeout(saveTimer);saveTimer=setTimeout(flush,5000);}}
  finally{saving=false;}
}
window.addEventListener('beforeunload',()=>{if(dirty)flush();});

async function crearFicha(f,openTab=0){
  const id='f-'+uid();curId=id;F=normalize(f);view='edit';tab=openTab;remoteNewer=false;openHU.clear();
  if(F.hus[0])openHU.add(F.hus[0].uid);
  dirty=true;await flush();render();window.scrollTo(0,0);}

function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{s.remove();ko(new Error('script'));};document.head.appendChild(s);});}
function loadPdfjs(){if(window.pdfjsLib&&window.pdfjsWorker)return Promise.resolve(window.pdfjsLib);
  /* El worker se carga como script: pdf.js lo detecta y procesa en la página, sin Worker de otro origen. */
  if(!pdfjsP)pdfjsP=Promise.all([loadScript(PDFJS+'pdf.min.js'),loadScript(PDFJS+'pdf.worker.min.js')]).then(()=>{

async function pdfText(file){
  docReading='Abriendo el PDF…';render();
  const lib=await loadPdfjs();
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  const out=[];
  try{for(let i=1;i<=pdf.numPages;i++){
    if(i===1||i%5===0){docReading=`Leyendo el PDF: página ${i} de ${pdf.numPages}…`;render();}
    const page=await pdf.getPage(i);const tc=await page.getTextContent();
    let t='';tc.items.forEach(it=>{if(typeof it.str!=='string')return;t+=it.str;if(it.hasEOL)t+='\n';});
    out.push(t.replace(/[ \t]+\n/g,'\n').replace(/[ \t]{2,}/g,' ').trim());page.cleanup();}}
  finally{pdf.destroy();}
  return out.filter(Boolean).join('\n\n').replace(/\n{3,}/g,'\n\n').trim();}
async function readDoc(file){
  docName=file.name;docErr='';const n=file.name.toLowerCase();
  try{
    if(n.endsWith('.pdf')||file.type==='application/pdf'){docText=await pdfText(file);
      if(trim(docText).length<40){docText='';docName='';docErr='Este PDF no tiene texto seleccionable (parece escaneado o una imagen). Pasalo por un OCR o copiá el texto a mano y pegalo en el recuadro.';}}
    else if(n.endsWith('.docx')){const mm=await loadMammoth();const r=await mm.extractRawText({arrayBuffer:await file.arrayBuffer()});docText=String(r.value||'').replace(/\n{3,}/g,'\n\n').trim();}
    else if(n.endsWith('.doc')){docErr='Los .doc viejos no se pueden leer. Guardalo como .docx o copiá y pegá el texto.';docName='';}
    else{let t=await file.text();if(/\.html?$/.test(n)){t=new DOMParser().parseFromString(t,'text/html').body.textContent||'';}docText=t.replace(/\n{3,}/g,'\n\n').trim();}
    if(!docErr&&!docText)docErr='El archivo no tiene texto para leer.';
  }catch(e){docName='';
    docErr=e&&e.name==='PasswordException'?'El PDF está protegido con contraseña. Quitale la protección o copiá y pegá el texto.'
      :e&&e.name==='InvalidPDFException'?'El archivo no parece un PDF válido.'
      :'No se pudo leer el archivo. Probá copiando y pegando el texto.';}
  docReading='';render();}

/* ---------- revisión ---------- */
function gaps(){const G=[],m=F.meta;
  if(!trim(m.codigo))G.push([0,'Falta el código del proyecto.']);
  if(!trim(m.nombre))G.push([0,'Falta el nombre del proyecto.']);
  if(!trim(m.organismo))G.push([0,'Falta el organismo.']);
  if(!trim(F.ctx.problema))G.push([1,'Falta describir el problema.']);
  if(!trim(F.ctx.alcance))G.push([1,'Falta definir qué incluye esta etapa.']);
  if(!F.perfiles.some(p=>trim(p.nombre)))G.push([2,'No hay perfiles de usuario.']);
  if(!F.hus.length)G.push([3,'No hay historias de usuario.']);
  const nombres=F.perfiles.map(p=>slug(p.nombre)).filter(Boolean);
  F.hus.forEach(h=>{const c=huCode(F,h);
    if(!trim(h.quiero))G.push([3,`${c}: falta el “quiero”.`,h.uid]);
    if(!trim(h.para))G.push([3,`${c}: falta el “para”.`,h.uid]);
    if(!h.prioridad)G.push([3,`${c}: falta la prioridad.`,h.uid]);
    if(!cas(h).length)G.push([3,`${c}: no tiene criterios de aceptación.`,h.uid]);
    if(trim(h.como)&&nombres.length&&!nombres.includes(slug(h.como)))G.push([3,`${c}: el perfil “${trim(h.como)}” no está en la lista de perfiles.`,h.uid,'info']);});
  if(!F.rnf.length)G.push([4,'No hay requerimientos no funcionales.']);
  if(!trim(F.datos.entidades))G.push([5,'Faltan los datos que se cargan o consultan.']);
  const ab=F.riesgos.filter(r=>r.estado!=='Resuelto').length;if(ab)G.push([6,`Hay ${ab} ${ab===1?'pendiente abierto':'pendientes abiertos'}.`,null,'info']);
  return G;}
function exportPanel(){const G=gaps();const nCA=F.hus.reduce((a,h)=>a+cas(h).length,0);
  return head('Cierre','Revisar y exportar','Antes de validar con el stakeholder, revisá lo que falta. Después exportá.')+
  `<div class="kpis"><div class="kpi"><b>${F.hus.length}</b><span>Historias de usuario</span></div><div class="kpi"><b>${nCA}</b><span>Criterios y casos de prueba</span></div><div class="kpi"><b>${F.rnf.length}</b><span>No funcionales</span></div><div class="kpi"><b>${F.riesgos.filter(r=>r.estado!=='Resuelto').length}</b><span>Pendientes abiertos</span></div></div>
  ${G.filter(g=>g[3]!=='info').length?`<div class="alert warn"><span class="ic" aria-hidden="true">!</span><div><b>Para revisar</b><ul class="checks" style="margin-top:6px">${G.map(g=>`<li><span class="dot${g[3]==='info'?' info':''}"></span><span>${esc(g[1])} <button type="button" class="linkish" data-go="${g[0]}"${g[2]?` data-hu="${g[2]}"`:''}>Ir</button></span></li>`).join('')}</ul></div></div>`
   :`<div class="alert ok"><span class="ic" aria-hidden="true">✓</span><span>La ficha está completa.${G.length?' Quedan '+G.length+' avisos menores.':''} Ya se puede validar con el stakeholder y cargar en Neurappi.</span></div>`}
  <div class="row"><span class="flabel">Formato</span><div class="seg" role="group" aria-label="Formato de exportación">${[['md','Markdown'],['csv','Planilla CSV'],['nrp','Neurappi']].map(([k,t])=>`<button type="button" data-exp="${k}" aria-pressed="${expMode===k}">${t}</button>`).join('')}</div></div>
  ${expMode==='md'?`<div class="exp"><h4>Documento para Claude</h4><p>Todo en Markdown: ocupa pocos tokens y Claude lo lee completo para seguir con el análisis, el modelado de datos y el diseño.</p>
     <div class="actions"><button type="button" class="btn btn-c" data-copy="md">Copiar Markdown</button><button type="button" class="btn btn-o" data-dl="md">Descargar .md</button></div><pre class="preview" tabindex="0" id="pv-md">${esc(toMd())}</pre></div>`:''}
  ${expMode==='csv'?`<div class="exp"><h4>Planilla de requerimientos</h4><p>Una fila por requerimiento (HU, no funcional y pendiente), separada por punto y coma para abrir directo en Excel o Google Sheets.</p>
     <div class="actions"><button type="button" class="btn btn-c" data-dl="csv">Descargar .csv</button><button type="button" class="btn btn-o" data-copy="csv">Copiar</button></div><pre class="preview" tabindex="0" id="pv-csv">${esc(toCsv())}</pre></div>`:''}
  ${expMode==='nrp'?`<div class="exp"><h4>Tareas para Neurappi</h4><p>Cada historia es una tarea. Copiá el título y la descripción en una tarea nueva del proyecto; las subtareas siguen el ciclo: diseño, datos, desarrollo y pruebas.</p>
     ${F.hus.map((h,i)=>{const n=toNrp(h);return `<div class="nrp"><div class="nrp-h"><strong>${esc(n.titulo)}</strong><button type="button" class="btn btn-o btn-s" data-cn="t" data-i="${i}">Copiar título</button><button type="button" class="btn btn-c btn-s" data-cn="d" data-i="${i}">Copiar descripción</button><button type="button" class="btn btn-t btn-s" data-cn="s" data-i="${i}">Copiar subtareas</button></div><pre class="preview" tabindex="0">${esc(n.desc+'\n\n— Subtareas —\n'+n.subs)}</pre></div>`;}).join('')||'<p>Todavía no hay historias de usuario.</p>'}</div>`:''}`;}

const one=v=>String(v??'').replace(/\s*\n\s*/g,' ').replace(/\|/g,'/').trim()||'—';
const blk=v=>trim(v)||'—';
function toMd(){const f=F,m=f.meta,c=f.ctx,d=f.datos,L=[];
  L.push(`# Requerimientos · ${trim(m.nombre)||'Proyecto sin nombre'}`,'');
  L.push(`> Ficha ${(LBL_EST[m.estado]||'Borrador').toLowerCase()} · versión ${m.version||'0.1'} · actualizada el ${hoy()} · Equipo UX`,'');
  L.push('## 1. Proyecto','','| Campo | Valor |','| --- | --- |');
  [['Código',COD(f)],['Organismo',m.organismo],['Área',m.area],['Referente',m.referente],['Contacto',m.contacto],['Tipo',(LBL[m.tipo]||'')+(m.tipo==='mejora'&&trim(m.plataforma)?` (${trim(m.plataforma)})`:'')],['Sistemas relacionados',m.sistemas.join(', ')],['Fecha que no se puede mover',m.fecha?fmtDate(m.fecha)+(trim(m.fechaMotivo)?` · ${trim(m.fechaMotivo)}`:''):''],['Responsable UX',m.responsable],['Primera reunión',fmtDate(m.reunion)],['Proyecto en Neurappi',m.neurappi],['Carpeta compartida',m.carpeta],['Origen',m.origen]]
    .forEach(([k,v])=>L.push(`| ${k} | ${one(v)} |`));
  const links=String(m.links||'').split('\n').map(trim).filter(Boolean);
  if(trim(m.material)||links.length){L.push('',`**Material:** ${blk(m.material)}`);links.forEach(l=>L.push(`- ${l}`));}
  L.push('','## 2. Contexto y objetivos','',`**Problema:** ${blk(c.problema)}`,'',`**Cómo se resuelve hoy:** ${blk(c.hoy)}`,'',`**Qué pasa si no se resuelve:** ${blk(c.siNo)}`,'',`**Objetivo (qué cambia si funciona):** ${blk(c.objetivo)}`,'');
  const sen=c.senales.map(x=>x==='Otro'&&trim(c.senalOtra)?trim(c.senalOtra):x);
  L.push(`**Indicadores de éxito:** ${sen.length?sen.join(', '):'—'}`,'',`**Incluye esta etapa:** ${blk(c.alcance)}`,'',`**Queda afuera:** ${blk(c.fuera)}`,'');
  if(m.tipo==='mejora')L.push('**Plataforma actual**','',`- Qué funciona bien: ${one(c.bien)}`,`- Qué genera quejas: ${one(c.quejas)}`,`- Datos de uso o reclamos: ${one(c.uso)}`,`- Acceso: ${one(c.accesoActual)}`,'');
  L.push('## 3. Perfiles de usuario','','| ID | Perfil | Cantidad | Dispositivo | Conexión | Manejo digital | Notas |','| --- | --- | --- | --- | --- | --- | --- |');
  f.perfiles.forEach((p,i)=>L.push(`| P${i+1} | ${one(p.nombre)} | ${one(p.cantidad)} | ${one(p.dispositivo)} | ${one(p.conexion)} | ${one(p.manejo)} | ${one(p.notas)} |`));
  L.push('','## 4. Requerimientos funcionales (historias de usuario)','');
  if(f.hus.length){L.push('| Código | Historia | Prioridad | Estado |','| --- | --- | --- | --- |');f.hus.forEach(h=>L.push(`| ${huCode(f,h)} | ${one(huTitle(h))} | ${one(h.prioridad)} | ${one(h.estado)} |`));L.push('');}
  f.hus.forEach(h=>{const code=huCode(f,h),cc=cas(h);
    L.push(`### ${code} · ${huTitle(h)}`,'',`**Como** ${trim(h.como)||'—'}, **quiero** ${trim(h.quiero)||'—'}, **para** ${trim(h.para)||'—'}.`,'');
    L.push(`- Prioridad: ${one(h.prioridad)}`,`- Estado: ${one(h.estado)}`,`- Origen: ${one(h.origen)}`);
    if(trim(h.datos))L.push(`- Datos involucrados: ${one(h.datos)}`);if(trim(h.deps))L.push(`- Depende de: ${one(h.deps)}`);
    if(trim(h.figma))L.push(`- Figma: ${trim(h.figma)}`);if(trim(h.neurappi))L.push(`- Neurappi: ${trim(h.neurappi)}`);
    L.push('','**Criterios de aceptación**','');cc.length?cc.forEach((x,j)=>L.push(`- CA${j+1}: ${one(x)}`)):L.push('- —');
    L.push('','**Casos de prueba (caja negra)**','');cc.length?cc.forEach((x,j)=>L.push(`- ${code}-TC${j+1} (CA${j+1}): ${one(tcOf(x))}`)):L.push('- —');
    if(trim(h.notas))L.push('',`**Notas:** ${blk(h.notas)}`);L.push('');});
  L.push('## 5. Requerimientos no funcionales','');
  if(f.rnf.length){L.push('| Código | Categoría | Requerimiento | Cómo se verifica |','| --- | --- | --- | --- |');f.rnf.forEach(r=>L.push(`| ${rnfCode(f,r)} | ${one(r.cat)} | ${one(r.desc)} | ${one(r.verif)} |`));}else L.push('—');
  L.push('','## 6. Datos y legales','',`- Datos que se cargan o consultan: ${one(d.entidades)}`,`- ¿Existen en una base?: ${LBL[d.base]||'—'}${d.base==='si'&&trim(d.baseCual)?` · ${one(d.baseCual)}`:''}`,`- ¿Tenemos acceso?: ${LBL[d.acceso]||'—'}`,`- Datos sensibles: ${d.sensibles.length?d.sensibles.join(', '):'—'}`,`- ¿Convenio, autorización o auditoría legal?: ${LBL[d.legal]||'—'}${d.legal==='si'&&trim(d.legalDetalle)?` · ${one(d.legalDetalle)}`:''}`,`- Responsable de los datos: ${one(d.responsable)}`);
  if(trim(d.notas))L.push(`- Notas: ${one(d.notas)}`);
  L.push('','## 7. Pendientes, riesgos y supuestos','');
  if(f.riesgos.length){L.push('| Código | Tipo | Descripción | Responsable | Estado |','| --- | --- | --- | --- | --- |');f.riesgos.forEach(r=>L.push(`| ${rCode(f,r)} | ${one(r.tipo)} | ${one(r.texto)} | ${one(r.resp)} | ${one(r.estado)} |`));}else L.push('—');
  L.push('','## 8. Convenciones','',`- Historias de usuario: ${COD(f)}-HU-001. Criterios: CA1, CA2… Casos de prueba: ${COD(f)}-HU-001-TC1, uno por criterio.`,`- No funcionales: ${COD(f)}-RNF-01. Pendientes: ${COD(f)}-R-01.`,'- Prioridad: Debe, Debería, Podría, No por ahora.','- Cada historia se carga como una tarea en Neurappi con el mismo código en el título.');
  return L.join('\n');}
function csvCell(v){v=String(v??'').replace(/\r?\n/g,' ').trim();return /[;"]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}
function toCsv(){const f=F;const H=['Código','Tipo','Título','Como','Quiero','Para','Prioridad','Estado','Criterios de aceptación','Casos de prueba','Origen','Datos involucrados','Depende de','Figma','Neurappi','Responsable'];
  const R=[H];
  f.hus.forEach(h=>{const code=huCode(f,h),cc=cas(h);R.push([code,'Historia de usuario',huTitle(h),h.como,h.quiero,h.para,h.prioridad,h.estado,cc.map((x,j)=>`CA${j+1}: ${x}`).join(' | '),cc.map((x,j)=>`${code}-TC${j+1}: ${tcOf(x)}`).join(' | '),h.origen,h.datos,h.deps,h.figma,h.neurappi,'']);});
  f.rnf.forEach(r=>R.push([rnfCode(f,r),'No funcional',r.cat,'',r.desc,'','','',r.verif,'','','','','','','']));
  f.riesgos.forEach(r=>R.push([rCode(f,r),r.tipo,r.texto,'','','','',r.estado,'','','','','','','',r.resp]));
  return R.map(r=>r.map(csvCell).join(';')).join('\r\n');}
function toNrp(h){const f=F,code=huCode(f,h),cc=cas(h),m=f.meta;
  const titulo=`${code} · ${huTitle(h)}`;
  const D=[`**Como** ${trim(h.como)||'—'}, **quiero** ${trim(h.quiero)||'—'}, **para** ${trim(h.para)||'—'}.`,'',
    `- Prioridad: ${one(h.prioridad)}`,`- Proyecto: ${trim(m.nombre)||'—'}${trim(m.organismo)?` (${trim(m.organismo)})`:''}`,`- Origen: ${one(h.origen)}`];
  if(trim(h.datos))D.push(`- Datos: ${one(h.datos)}`);if(trim(h.deps))D.push(`- Depende de: ${one(h.deps)}`);if(trim(h.figma))D.push(`- Figma: ${trim(h.figma)}`);
  D.push('','**Criterios de aceptación**');cc.length?cc.forEach((x,j)=>D.push(`- CA${j+1}: ${one(x)}`)):D.push('- A definir');
  D.push('','**Casos de prueba (caja negra)**');cc.length?cc.forEach((x,j)=>D.push(`- ${code}-TC${j+1}: ${one(tcOf(x))}`)):D.push('- A definir');
  const legal=f.datos.sensibles.some(x=>x!=='Ninguno'&&x!=='No sé')||f.datos.legal==='si'||f.datos.legal==='nose';
  const S=[`1. Diseño de flujo y pantallas · Equipo: UX`,`   - [ ] Flujo de la tarea`,`   - [ ] Wireframe y prototipo en Figma`,`   - [ ] Validación con el stakeholder`,
    `2. Modelado de datos · Equipo: Datos`,`   - [ ] Entidades y campos${trim(h.datos)?`: ${one(h.datos)}`:''}`,`   - [ ] Acceso a la fuente de datos`];
  let n=3;if(legal){S.push(`${n}. Revisión legal de datos · Equipo: Legales`,`   - [ ] Datos sensibles y autorizaciones`);n++;}
  S.push(`${n}. Desarrollo · Equipo: Sistemas`);cc.length?cc.forEach((x,j)=>S.push(`   - [ ] CA${j+1} implementado`)):S.push('   - [ ] Implementar la historia');n++;
  S.push(`${n}. Pruebas de caja negra · Equipos: UX y Sistemas`);cc.length?cc.forEach((x,j)=>S.push(`   - [ ] ${code}-TC${j+1}: ${one(tcOf(x))}`)):S.push('   - [ ] Definir casos de prueba');
  return {titulo,desc:D.join('\n'),subs:S.join('\n')};}

let downloads=null;
function copyText(txt,ok,pre){
  const fb=()=>{if(pre){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto seleccionado: copialo con Ctrl+C (o Cmd+C).');}else toast('No se pudo copiar.');};
  try{navigator.clipboard.writeText(txt).then(()=>toast(ok),fb);}catch(e){fb();}}
async function saveFile(name,data,type){
  const blob=new Blob([data],{type});
  if(downloads){try{await downloads.save({filename:name,data:blob});toast('Archivo guardado.');}catch(e){if(e&&e.code==='declined')return;toast('No se pudo descargar. Usá Copiar.');}return;}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}catch(e){toast('No se pudo descargar. Usá Copiar.');}}
const fname=ext=>`requerimientos-${slug(COD(F))}-${slug(F.meta.nombre||'proyecto').slice(0,40)}-v${slug(F.meta.version||'0-1')}.${ext}`;

  if(t.id==='q'){q=t.value;const pos=t.selectionStart;render();const n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}return;}
  if(t.id==='impText'){importText=t.value;return;}
  if(t.id==='docText'){docText=t.value;if(!t.value)docName='';return;}
  if(t.id==='claudeResp'){claudeResp=t.value;return;}
  const p=t.dataset&&t.dataset.p;if(!p||!F)return;
  let v=t.value;if(p==='meta.codigo'){v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');if(v!==t.value)t.value=v;}
  setP(F,p,v);liveUpdate(p);scheduleSave();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impFile'&&t.files&&t.files[0]){readFile(t.files[0]);return;}
  if(t.id==='docFile'&&t.files&&t.files[0]){readDoc(t.files[0]);return;}
  const p=t.dataset&&t.dataset.p;if(!p||!F)return;
  if(p==='meta.codigo'||t.dataset.re){render();}
  if(/^perfiles\.\d+\.nombre$/.test(p)){/* refresca títulos de perfil */const i=+p.split('.')[1];const it=document.querySelectorAll('.item-head strong')[i];if(it)it.innerHTML=`<span class="code-sm">P${i+1}</span> ${esc(trim(F.perfiles[i].nombre)||'Perfil sin nombre')}`;}
});
function readFile(file){const r=new FileReader();r.onload=()=>{importText=String(r.result||'');importErr='';render();toast('Archivo leído. Revisá y tocá Crear ficha.');};r.onerror=()=>{importErr='No se pudo leer el archivo. Probá pegando el texto.';render();};r.readAsText(file);}
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop,#docDrop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop,#docDrop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop,#docDrop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){if(d.id==='docDrop'){if(!docBusy&&!docReading)readDoc(f);}else readFile(f);}}});

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const ds=b.dataset;
  if(ds.open){abrir(ds.open);return;}
  if(ds.tab!=null&&ds.tab!==''){const n=+ds.tab;if(n>=0&&n<TABS.length){const fromNav=!!b.closest('.nav');tab=n;try{sessionStorage.setItem('fr-tab',n);}catch(_){}if(fromNav){render();$('#panel').scrollIntoView({block:'start'});}else keep(render);const tb=$('#tab'+n);if(tb&&!fromNav)tb.focus();}return;}
  if(ds.go!=null){tab=+ds.go;if(ds.hu)openHU.add(ds.hu);render();$('#panel').scrollIntoView({block:'start'});return;}
  if(ds.chip){const p=ds.chip,v=ds.v,cur=getP(F,p);
    if(Array.isArray(cur)){const i=cur.indexOf(v);if(i>=0)cur.splice(i,1);else{cur.push(v);if(p==='meta.sistemas'||p==='datos.sensibles'){const ex=['Ninguno','No sé'];if(ex.includes(v))cur.splice(0,cur.length,v);else ex.forEach(x=>{const k=cur.indexOf(x);if(k>=0)cur.splice(k,1);});}}}
    else setP(F,p,cur===v?'':v);
    scheduleSave();
    if(p==='meta.estado'){const el=$('#hdEst');el.className='st st-'+F.meta.estado;el.textContent=LBL_EST[F.meta.estado]||'Borrador';}
    const y=window.scrollY;render();window.scrollTo(0,y);
    const nb=document.querySelector(`[data-chip="${CSS.escape(p)}"][data-v="${CSS.escape(v)}"]`);if(nb)nb.focus();return;}
  if(ds.del){const arr=F[ds.del];arr.splice(+ds.i,1);if(ds.del==='perfiles'&&!arr.length)arr.push(nuevoPerfil());scheduleSave();keep(render);return;}
  if(ds.addca!=null){const h=F.hus[+ds.addca];h.cas.push('');scheduleSave();keep(render);const el=document.getElementById(fid(`hus.${ds.addca}.cas.${h.cas.length-1}`));if(el)el.focus();return;}
  if(ds.delca!=null){const h=F.hus[+ds.delca];h.cas.splice(+ds.j,1);if(!h.cas.length)h.cas.push('');scheduleSave();keep(render);return;}
  if(ds.delhu!=null){const h=F.hus[+ds.delhu];if(armedDelete!==h.uid){armedDelete=h.uid;keep(render);setTimeout(()=>{if(armedDelete===h.uid){armedDelete=false;if(view==='edit'&&tab===3)keep(render);}},4000);return;}
    F.hus.splice(+ds.delhu,1);armedDelete=false;scheduleSave();keep(render);toast(`Se quitó ${huCode(F,h)}.`);return;}
  if(ds.exp){expMode=ds.exp;keep(render);return;}
  if(ds.copy){const t=ds.copy==='md'?toMd():toCsv();copyText(t,ds.copy==='md'?'Markdown copiado. Pegalo en Claude.':'Planilla copiada.',$('#pv-'+ds.copy));return;}
  if(ds.dl){if(ds.dl==='md')saveFile(fname('md'),toMd(),'text/markdown');else saveFile(fname('csv'),'﻿'+toCsv(),'text/csv');return;}
  if(ds.cn){const n=toNrp(F.hus[+ds.i]);const t=ds.cn==='t'?n.titulo:ds.cn==='d'?n.desc:n.subs;copyText(t,ds.cn==='t'?'Título copiado.':ds.cn==='d'?'Descripción copiada.':'Subtareas copiadas.',b.closest('.nrp').querySelector('pre'));return;}
  switch(ds.act){
    case 'toggle-import':importOpen=!importOpen;importErr='';render();if(importOpen){const t=$('#impText');if(t)t.focus();}break;
    case 'do-import':{if(!trim(importText)){importErr='Pegá el resumen o subí el archivo .md antes de crear la ficha.';render();break;}
      try{const f=parseCuestionario(importText);importText='';importErr='';importOpen=false;await crearFicha(f,0);toast(`Ficha creada con ${f.hus.length} ${f.hus.length===1?'historia':'historias'} y ${f.rnf.length+f.riesgos.length} sugerencias. Completá el nombre y el código.`);}
      catch(err){importErr='El texto no parece el resumen del cuestionario previo. Tiene que empezar con “# Cuestionario previo”.';render();}break;}
    case 'toggle-doc':docOpen=!docOpen;docErr='';render();if(docOpen){const t=$('#docText');if(t)t.focus();}break;
    case 'doc-stop':if(docCtl)docCtl.abort();break;
    case 'do-doc':{if(!trim(docText)){docErr='Subí un documento o pegá su texto antes de continuar.';render();break;}
      if(/^\s*#\s*Cuestionario previo/.test(docText)){
        try{const f=parseCuestionario(docText);docOpen=false;docText='';docName='';docErr='';await crearFicha(f,0);toast(`Ficha creada con ${f.hus.length} ${f.hus.length===1?'historia':'historias'} y ${f.rnf.length+f.riesgos.length} sugerencias. Completá el nombre y el código.`);}
        catch(err){docErr='No se pudo leer el resumen del cuestionario. Revisá que esté completo.';render();}
        break;}
      if(!sampleNS){let f;try{f=extraerLocal(docText,docName);}catch(err){docErr='No se pudo armar la ficha con este documento. Probá pasándolo por Claude (abajo) o cargala a mano.';render();break;}
        const nm=docName,n=f.hus.filter(h=>trim(h.quiero)).length;docOpen=false;viaClaude=false;docText='';docName='';docErr='';
        await crearFicha(f,n?3:0);
        toast(n?`Borrador armado desde ${nm?'«'+nm+'»':'el documento'}: ${n} ${n===1?'historia':'historias'} y ${f.rnf.length} no funcionales. Revisalo y completalo.`:'No se encontraron historias de usuario en el documento. Revisá los datos cargados y agregalas a mano.');
        break;}
      docBusy=true;docErr='';render();docCtl=new AbortController();
      try{const raw=await sampleNS.json(promptDoc(docText,docName),{signal:docCtl.signal,modelTier:'default'});
        const f=fromClaude(raw);docBusy=false;docOpen=false;const nm=docName;docText='';docName='';
        await crearFicha(f,0);toast(`Ficha creada desde ${nm?'«'+nm+'»':'el documento'}: ${f.hus.length} ${f.hus.length===1?'historia':'historias'}. Revisala antes de validar.`);}
      catch(err){docBusy=false;if(err&&err.code==='cancelled'){toast('Se detuvo la lectura del documento.');render();break;}
        docErr=sampleErr(err);if(err&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(err.code))sampleNS=null;render();}
      break;}
    case 'via-claude':viaClaude=!viaClaude;keep(render);break;
    case 'copy-prompt':case 'dl-prompt':{if(!trim(docText)){docErr='Subí un documento o pegá su texto antes de copiar el pedido.';keep(render);break;}
      const pr=promptDoc(docText,docName);if(ds.act==='dl-prompt'){saveFile(`pedido-ficha-${slug(docName||'documento').slice(0,40)}.txt`,pr,'text/plain');break;}
      copyText(pr,'Pedido copiado. Pegalo en una conversación nueva en claude.ai.',null);break;}
    case 'do-claude-resp':{if(!trim(claudeResp)){docErr='Pegá la respuesta de Claude antes de crear la ficha.';keep(render);break;}
      let f;try{f=fromClaude(parseRespuesta(claudeResp));}catch(err){docErr='La respuesta no tiene el formato esperado. Copiá la respuesta completa de Claude, desde la primera llave { hasta la última }.';keep(render);break;}
      const nm=docName;docOpen=false;viaClaude=false;claudeResp='';docText='';docName='';docErr='';
      await crearFicha(f,0);toast(`Ficha creada con Claude${nm?' desde «'+nm+'»':''}: ${f.hus.length} ${f.hus.length===1?'historia':'historias'}. Revisala antes de validar.`);break;}
    case 'blank':{const f=blank();f.hus.push(nuevaHU(f));await crearFicha(f,0);break;}
    case 'example':await crearFicha(ejemplo(),3);toast('Ficha de ejemplo creada. Podés eliminarla cuando quieras.');break;
    case 'home':await flush();view='home';F=null;curId=null;setSaveState('');render();window.scrollTo(0,0);break;
    case 'reload':{const id=curId;dirty=false;abrir(id);break;}
    case 'add-perfil':F.perfiles.push(nuevoPerfil());scheduleSave();keep(render);break;
    case 'add-hu':{const h=nuevaHU(F);F.hus.push(h);openHU.add(h.uid);scheduleSave();keep(render);const el=document.getElementById(fid(`hus.${F.hus.length-1}.como`));if(el){el.scrollIntoView({block:'center'});el.focus();}break;}
    case 'toggle-hu':{const u=ds.uid;openHU.has(u)?openHU.delete(u):openHU.add(u);keep(render);break;}
    case 'expand-all':F.hus.forEach(h=>openHU.add(h.uid));keep(render);break;
    case 'collapse-all':openHU.clear();keep(render);break;
    case 'add-rnf':F.rnf.push(nuevoRNF(F));scheduleSave();keep(render);break;
    case 'add-r':F.riesgos.push(nuevoR(F));scheduleSave();keep(render);break;
    case 'suggest':{const n=aplicarSugerencias(F);if(n){scheduleSave();keep(render);toast(`Se agregaron ${n} sugerencias. Revisalas y ajustalas.`);}else toast('No hay sugerencias nuevas con lo que está cargado.');break;}
    case 'delete':{if(armedDelete!=='ficha'){armedDelete='ficha';b.textContent='Tocá de nuevo para eliminar la ficha';setTimeout(()=>{if(armedDelete==='ficha'){armedDelete=false;if(b.isConnected)b.textContent='Eliminar ficha';}},4000);break;}
      armedDelete=false;const id=curId;clearTimeout(saveTimer);dirty=false;view='home';F=null;curId=null;
      try{await Store.remove(id);toast('Ficha eliminada.');}catch(err){toast('No se pudo eliminar la ficha.');}setSaveState('');render();break;}
  }
});
function keep(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}

/* ---------- ejemplo ---------- */

  Object.assign(m,{codigo:'EJ',nombre:'Ejemplo · Asistencia en comedores',organismo:'Organismo de ejemplo',area:'Dirección de ejemplo',tipo:'nueva',sistemas:['SISOC · Gestión de programas sociales'],responsable:'Equipo UX',estado:'borrador',origen:'Ficha de ejemplo para conocer la herramienta'});
  Object.assign(f.ctx,{problema:'Los comedores registran la asistencia en papel y después la pasan a una planilla. Se pierden datos y los reportes llegan tarde.',hoy:'Planillas en papel que se pasan a Excel una vez por mes.',objetivo:'La asistencia se carga el mismo día desde el celular y el equipo central ve los datos sin pedirlos.',senales:['Menos tiempo de carga','Datos más confiables'],alcance:'Carga diaria de asistencia y reporte mensual por comedor.',fuera:'Gestión de compras y pagos.'});
  f.perfiles=[Object.assign(nuevoPerfil(),{nombre:'Referente de comedor',cantidad:'1.200',dispositivo:'Celular',conexion:'Mala o sin conexión',manejo:'Más o menos'}),Object.assign(nuevoPerfil(),{nombre:'Equipo técnico central',cantidad:'15',dispositivo:'Computadora',conexion:'Buena',manejo:'Mucho'})];
  f.hus.push(nuevaHU(f,{como:'Referente de comedor',quiero:'cargar la asistencia del día desde el celular',para:'no hacerlo en papel y después pasarlo',prioridad:'Debe',origen:'Cuestionario',cas:['Dado que no hay señal, cuando guardo la asistencia, entonces queda pendiente y se envía sola al reconectar','La carga de un día completo lleva menos de 2 minutos'],datos:'comedor, persona, asistencia'}));
  f.hus.push(nuevaHU(f,{como:'Equipo técnico central',quiero:'ver un reporte mensual de asistencia por comedor',para:'detectar caídas y planificar las entregas',prioridad:'Debería',origen:'Reunión',cas:['El reporte se puede filtrar por mes y por provincia','Se puede descargar en formato de planilla']}));
  Object.assign(f.datos,{entidades:'Comedor, persona que asiste (sin DNI en esta etapa), registro de asistencia por día.',base:'si',baseCual:'Padrón de comedores del programa',acceso:'pedir',sensibles:['Datos personales','Personas menores de edad'],legal:'nose'});
  aplicarSugerencias(f);return f;}

render();
(async()=>{
  try{if(window.claude&&typeof window.claude.use==='function')downloads=await window.claude.use('downloads');}catch(e){downloads=null;}
  try{if(window.claude&&typeof window.claude.use==='function')sampleNS=await window.claude.use('sample');}catch(e){sampleNS=null;}
  if(sampleNS&&view==='home'&&Store.mode!=='cargando')render();
})();
(async()=>{await Store.init();Store.watch(onDocs);if(view==='home')render();})();
})();
